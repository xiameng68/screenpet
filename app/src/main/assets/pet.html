<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif;touch-action:none}
  #stage{position:relative;width:100%;height:100%}
  #bubble{position:fixed;max-width:150px;padding:7px 12px;background:rgba(255,255,255,.97);color:#2a2a33;font-size:12px;line-height:1.35;font-weight:600;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .25s;word-break:break-word;text-align:center;z-index:100}
  #bubble::after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(255,255,255,.97);border-bottom:none}
  #bubble.show{opacity:1}
  #think{position:fixed;font-size:16px;opacity:0;transition:opacity .2s;z-index:100;top:6%;right:8%}
  #think.show{opacity:1;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #pet{position:absolute;left:0;top:0;width:100%;height:100%;cursor:pointer;touch-action:none;transform-origin:0 0;will-change:transform}
  .breathe{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 95%;width:100%;height:100%}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.978)}}
  #pet.happy .breathe{animation:hop .45s ease-in-out 2}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-12%) scale(.96,1.05)}70%{transform:translateY(0) scale(1.05,.95)}}
  .tail{transform-box:view-box;transform-origin:86px 88px;animation:tailWag 2.2s ease-in-out infinite}
  @keyframes tailWag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
  .ear{transform-box:view-box}
  .ear-l{transform-origin:38px 52px;animation:earTwitch 6.5s ease-in-out infinite}
  .ear-r{transform-origin:82px 52px;animation:earTwitch 6.5s ease-in-out .5s infinite}
  @keyframes earTwitch{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-8deg)}94%{transform:rotate(5deg)}}
  .eye{transform-box:fill-box;transform-origin:center}
  .eye.blink{animation:blink .16s ease-in-out}
  @keyframes blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
  .heart{position:fixed;z-index:99;pointer-events:none;font-size:16px;line-height:1;animation:floatUp 1.3s cubic-bezier(.2,.7,.4,1) forwards}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.3)}18%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-95px) scale(.7)}}
  #petImg{position:absolute;bottom:0;left:0;width:100%;height:100%;object-fit:contain;display:none;pointer-events:none}
  #pet.hasImage #petImg{display:block}
  #pet.hasImage svg{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="think">⚙️</div>
  <div id="bubble"></div>
  <div id="pet">
    <div class="breathe">
      <svg id="svgPet" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
        <defs>
          <radialGradient id="fur" cx="38%" cy="26%" r="80%"><stop offset="0%" stop-color="#FFF7EA"/><stop offset="55%" stop-color="#FFD9A0"/><stop offset="100%" stop-color="#F0A94F"/></radialGradient>
          <radialGradient id="earG" cx="50%" cy="22%" r="88%"><stop offset="0%" stop-color="#FFD9A0"/><stop offset="100%" stop-color="#EBA04A"/></radialGradient>
          <radialGradient id="blush"><stop offset="0%" stop-color="#FF9DB0" stop-opacity=".9"/><stop offset="100%" stop-color="#FF9DB0" stop-opacity="0"/></radialGradient>
        </defs>
        <g class="breathe">
          <path class="tail" d="M86 88 C112 96, 122 72, 108 54" fill="none" stroke="#F7C176" stroke-width="11" stroke-linecap="round"/>
          <g class="ear ear-l"><path d="M32 58 L24 14 L56 44 Z" fill="url(#earG)"/><path d="M35 53 L30 23 L49 42 Z" fill="#FFB8C6" opacity=".8"/></g>
          <g class="ear ear-r"><path d="M88 58 L96 14 L64 44 Z" fill="url(#earG)"/><path d="M85 53 L90 23 L71 42 Z" fill="#FFB8C6" opacity=".8"/></g>

          <ellipse cx="33" cy="83" rx="8" ry="5" fill="url(#blush)"/><ellipse cx="87" cy="83" rx="8" ry="5" fill="url(#blush)"/>
          <g class="eye eye-l"><ellipse cx="46" cy="70" rx="6" ry="7.5" fill="#3A2B28"/><circle cx="48.2" cy="67" r="2.2" fill="#fff"/></g>
          <g class="eye eye-r"><ellipse cx="74" cy="70" rx="6" ry="7.5
