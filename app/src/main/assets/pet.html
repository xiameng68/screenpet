<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif;touch-action:none}
  #stage{position:relative;width:100%;height:100%}
  #bubble{position:absolute;bottom:88%;left:50%;transform:translateX(-50%) translateY(6px);max-width:150px;padding:7px 12px;background:rgba(255,255,255,.97);color:#2a2a33;font-size:12px;line-height:1.35;font-weight:600;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;word-break:break-word;text-align:center}
  #bubble::after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(255,255,255,.97);border-bottom:none}
  #bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #think{position:absolute;top:6%;right:8%;font-size:16px;opacity:0;transition:opacity .2s}
  #think.show{opacity:1;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #pet{position:absolute;bottom:0;left:0;width:100%;height:100%;cursor:pointer;touch-action:none;transform-origin:center center}
  .breathe{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 95%;width:100%;height:100%}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.978)}}
  #pet.happy .breathe{animation:hop .45s ease-in-out 2}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-12%) scale(.96,1.05)}70%{transform:translateY(0) scale(1.05,.95)}}
  .tail{transform-box:view-box;transform-origin:86px 88px;animation:tailWag 2.2s ease-in-out infinite}
  @keyframes tailWag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
  .ear{transform-box:view-box}
  .ear-l{transform-origin:38px 52px;animation:earTwitch 6.5s ease-in-out infinite}
  .ear-r{transform-origin:82px 52px;animation:earTwitch 6.5s ease-in-out .5s infinite}
  @keyframes earTwitch{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-8deg)}94%{transform:rotate(5deg)}}
  .eye{transform-box:fill-box;transform-origin:center}
  .eye.blink{animation:blink .16s ease-in-out}
  @keyframes blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
  .heart{position:fixed;z-index:99;pointer-events:none;font-size:16px;line-height:1;animation:floatUp 1.3s cubic-bezier(.2,.7,.4,1) forwards}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.3)}18%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-95px) scale(.7)}}
  #petImg{position:absolute;bottom:0;left:0;width:100%;height:100%;object-fit:contain;display:none;pointer-events:none}
  #pet.hasImage #petImg{display:block}
  #pet.hasImage svg{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="think">⚙️</div>
  <div id="bubble"></div>
  <div id="pet">
    <div class="breathe">
      <svg id="svgPet" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
        <defs>
          <radialGradient id="fur" cx="38%" cy="26%" r="80%"><stop offset="0%" stop-color="#FFF7EA"/><stop offset="55%" stop-color="#FFD9A0"/><stop offset="100%" stop-color="#F0A94F"/></radialGradient>
          <radialGradient id="earG" cx="50%" cy="22%" r="88%"><stop offset="0%" stop-color="#FFD9A0"/><stop offset="100%" stop-color="#EBA04A"/></radialGradient>
          <radialGradient id="blush"><stop offset="0%" stop-color="#FF9DB0" stop-opacity=".9"/><stop offset="100%" stop-color="#FF9DB0" stop-opacity="0"/></radialGradient>
        </defs>
        <g class="breathe">
          <path class="tail" d="M86 88 C112 96, 122 72, 108 54" fill="none" stroke="#F7C176" stroke-width="11" stroke-linecap="round"/>
          <g class="ear ear-l"><path d="M32 58 L24 14 L56 44 Z" fill="url(#earG)"/><path d="M35 53 L30 23 L49 42 Z" fill="#FFB8C6" opacity=".8"/></g>
          <g class="ear ear-r"><path d="M88 58 L96 14 L64 44 Z" fill="url(#earG)"/><path d="M85 53 L90 23 L71 42 Z" fill="#FFB8C6" opacity=".8"/></g>
          <ellipse cx="60" cy="72" rx="37" ry="33" fill="url(#fur)"/>
          <ellipse cx="46" cy="102" rx="11" ry="7" fill="#FFF0D6"/><ellipse cx="74" cy="102" rx="11" ry="7" fill="#FFF0D6"/>
          <ellipse cx="33" cy="83" rx="8" ry="5" fill="url(#blush)"/><ellipse cx="87" cy="83" rx="8" ry="5" fill="url(#blush)"/>
          <g class="eye eye-l"><ellipse cx="46" cy="70" rx="6" ry="7.5" fill="#3A2B28"/><circle cx="48.2" cy="67" r="2.2" fill="#fff"/></g>
          <g class="eye eye-r"><ellipse cx="74" cy="70" rx="6" ry="7.5" fill="#3A2B28"/><circle cx="76.2" cy="67" r="2.2" fill="#fff"/></g>
          <path d="M57 79 L63 79 L60 83 Z" fill="#FF8FA3"/>
          <path d="M60 83.5 Q56.8 88.2 53.6 84.6" fill="none" stroke="#C98A6A" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M60 83.5 Q63.2 88.2 66.4 84.6" fill="none" stroke="#C98A6A" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </svg>
      <img id="petImg" alt="pet"/>
    </div>
  </div>
</div>
<script>
(function(){
  const pet=document.getElementById('pet'),bubble=document.getElementById('bubble'),think=document.getElementById('think'),img=document.getElementById('petImg');
  let bubbleTimer;
  window.petSay=function(t){bubble.textContent=t;bubble.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),3600)};
  window.petThink=function(o){think.classList.toggle('show',!!o)};
  window.petWear=function(s,v){};

  // 让原生代码能设置自定义图片
  window.setPetImage=function(dataUrl){
    if(dataUrl){ img.src=dataUrl; pet.classList.add('hasImage'); }
    else { img.src=''; pet.classList.remove('hasImage'); }
  };

  const eyes=document.querySelectorAll('.eye');
  function blink(){eyes.forEach(e=>e.classList.add('blink'));setTimeout(()=>eyes.forEach(e=>e.classList.remove('blink')),180)}
  (function loop(){setTimeout(()=>{blink();if(Math.random()<.22)setTimeout(blink,200);loop()},2200+Math.random()*4000)})();

  // 拖动 + 双指缩放
  let startX=0,startY=0,lastX=0,lastY=0,dragging=false,moved=false;
  let lastDist=0, scaling=false, currentScale=1;

  pet.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      scaling=true; dragging=false;
      lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      return;
    }
    const t=e.touches[0]; startX=lastX=t.clientX; startY=lastY=t.clientY; dragging=true; moved=false; scaling=false;
  },{passive:true});

  pet.addEventListener('touchmove',e=>{
    if(scaling && e.touches.length===2){
      const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if(lastDist>0){
        const ratio=dist/lastDist;
        currentScale=Math.min(3, Math.max(0.5, currentScale*ratio));
        pet.style.transform='scale('+currentScale+')';
      }
      lastDist=dist;
      return;
    }
    if(!dragging)return;
    const t=e.touches[0]; const dx=t.clientX-lastX,dy=t.clientY-lastY; lastX=t.clientX; lastY=t.clientY;
    if(Math.hypot(t.clientX-startX,t.clientY-startY)>8)moved=true;
    if(moved && window.AndroidBridge) AndroidBridge.onDrag(dx,dy);
  },{passive:true});

  pet.addEventListener('touchend',()=>{
    if(scaling){scaling=false;lastDist=0;return;}
    if(!dragging)return; dragging=false;
    if(moved){if(window.AndroidBridge)AndroidBridge.onDragEnd();}
    else{trigger()}
  });
  function trigger(){pet.classList.remove('happy');void pet.offsetWidth;pet.classList.add('happy');setTimeout(()=>pet.classList.remove('happy'),900);if(window.AndroidBridge)AndroidBridge.onPetClick()}
  pet.addEventListener('click',e=>{if(!('ontouchstart' in window))trigger()});
})();
</script>
</body>
</html>
